name: Deploy to Prod ECS
on:
  push:
    branches:
      - main
env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 891924441446.dkr.ecr.af-south-1.amazonaws.com
jobs:
  build-and-push-prod:
    name:  Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - app_name: "Auth Service"
            dockerfile: services/auth-service/Dockerfile
            image: zika/auth-service
          - app_name: "Listing Service"
            dockerfile: services/listing-service/Dockerfile
            image: zika/listing-service
          - app_name: "Payment Service"
            dockerfile: services/payment-service/Dockerfile
            image: zika/payment-service
          - app_name: "Web App"
            dockerfile: apps/web/Dockerfile
            image: zika/web
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.kainook.com/auth
              NEXT_PUBLIC_AUTH_API_URL=https://api.kainook.com/auth
              NEXT_PUBLIC_LISTING_API_URL=https://api.kainook.com/listings
              NEXT_PUBLIC_PAYMENT_API_URL=https://api.kainook.com/payments
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}}
              NEXT_PUBLIC_FIREBASE_API_KEY=${{vars.NEXT_PUBLIC_FIREBASE_API_KEY}}
              NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}}
              NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID}}
              NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}}
              NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}}
              NEXT_PUBLIC_FIREBASE_APP_ID=${{vars.NEXT_PUBLIC_FIREBASE_APP_ID}}
              NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY}}
          - app_name: "Web Admin"
            dockerfile: apps/admin/Dockerfile
            image: zika/admin
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.kainook.com/auth
              NEXT_PUBLIC_AUTH_API_URL=https://api.kainook.com/auth
              NEXT_PUBLIC_LISTING_API_URL=https://api.kainook.com/listings
              NEXT_PUBLIC_PAYMENT_API_URL=https://api.kainook.com/payments
              NEXT_PUBLIC_PAYMENT_ADMIN_API_URL=https://api.kainook.com/payments
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      # The gha/registry cache backends need a container-driver buildx builder;
      # the default docker driver only supports inline cache export.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Publish ${{ matrix.app_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Prod builds are always fully fresh — no layer cache reuse at all, so a
          # stale cached layer can never be deployed. Slower, but deterministic.
          # no-cache: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:prod-${{ github.sha }}
          # gha backend caches ALL stages (incl. the builder's pnpm install) in
          # GitHub's cache service between runs, so unchanged lockfiles skip the
          # store download entirely. Inline (default, mode=min) only cached the
          # final-stage layers, which is why installs rebuilt every run.
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.image }}:latest
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          build-args: ${{ matrix.build_args }}
  deploy-prod:
    name: "Deploy to Production"
    needs: build-and-push-prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: af-south-1
      # Deploy by registering a NEW task definition per service with the image
      # pinned to the exact prod-<sha> just built, then updating the service to
      # it. The existing task definitions (registered manually) pin older images,
      # which is why --force-new-deployment alone kept re-deploying stale code
      # while services-stable passed. The ALB target-group health checks gate
      # services-stable, so a broken task fails the deployment.
      - name: Deploy all services in parallel
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for spec in \
            "kainook-auth:auth-service:zika/auth-service" \
            "kainook-listing:listing-service:zika/listing-service" \
            "kainook-payment:payment-service:zika/payment-service" \
            "kainook-web:web:zika/web" \
            "kainook-admin:admin:zika/admin"; do
            IFS=':' read -r ecs_svc _ img <<< "$spec"
            NEW_IMAGE="${{ env.ECR_REGISTRY }}/$img:prod-$SHA"
            TD=$(aws ecs describe-task-definition --task-definition "$ecs_svc" --query 'taskDefinition' --output json)
            NEW_TD=$(printf '%s' "$TD" | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .taskDefinitionId) | .containerDefinitions[].image = $image' --arg image "$NEW_IMAGE")
            REV=$(aws ecs register-task-definition --cli-input-json "$NEW_TD" --query 'taskDefinition.revision' --output text)
            aws ecs update-service --cluster kainook-prod-cluster --service "$ecs_svc" --task-definition "$ecs_svc:$REV" --force-new-deployment --region af-south-1
            echo "deployed $ecs_svc -> $NEW_IMAGE (task-def rev $REV)"
          done
          aws ecs wait services-stable --cluster kainook-prod-cluster --services kainook-auth kainook-listing kainook-payment kainook-web kainook-admin --region af-south-1
