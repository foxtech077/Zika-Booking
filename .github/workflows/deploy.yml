name: Deploy to EC2
on:
  push:
    branches:
      - dev
env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 891924441446.dkr.ecr.af-south-1.amazonaws.com
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ZIKA__AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ZIKA__AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/zika/auth-service:latest
      - name: Build and push listing-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/listing-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/zika/listing-service:latest
      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/payment-service/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/zika/payment-service:latest
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/zika/web:latest
      - name: Build and push admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/zika/admin:latest
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-00c4c4e18f6b3e18a" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Zika-Booking" \
            --parameters '{"commands":["cd /home/ubuntu/Zika-Booking","git fetch origin dev","git switch dev","git reset --hard origin/dev","aws ecr get-login-password --region af-south-1 | docker login --username AWS --password-stdin 891924441446.dkr.ecr.af-south-1.amazonaws.com","docker compose pull","docker compose up -d --remove-orphans","docker image prune -f"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-00c4c4e18f6b3e18a"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-00c4c4e18f6b3e18a" --query "StandardOutputContent" --output text
