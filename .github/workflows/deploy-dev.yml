name: Deploy to Dev EC2
on:
  push:
    branches:
      - dev
env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 891924441446.dkr.ecr.af-south-1.amazonaws.com
jobs:
  build-and-push:
    name:  Build ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app_name: "Auth Service"
            dockerfile: services/auth-service/Dockerfile
            image: zika/auth-service
          - app_name: "Listing Service"
            dockerfile: services/listing-service/Dockerfile
            image: zika/listing-service
          - app_name: "Payment Service"
            dockerfile: services/payment-service/Dockerfile
            image: zika/payment-service
          - app_name: "Web App"
            dockerfile: apps/web/Dockerfile
            image: zika/web
            build_args: |
              NEXT_PUBLIC_API_URL=${{vars.NEXT_PUBLIC_API_URL}}
              NEXT_PUBLIC_AUTH_API_URL=${{vars.NEXT_PUBLIC_AUTH_API_URL}}
              NEXT_PUBLIC_LISTING_API_URL=${{vars.NEXT_PUBLIC_LISTING_API_URL}}
              NEXT_PUBLIC_PAYMENT_API_URL=${{vars.NEXT_PUBLIC_PAYMENT_API_URL}}
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          - app_name: "Web Admin"
            dockerfile: apps/admin/Dockerfile
            image: zika/admin
            build_args: |
              NEXT_PUBLIC_API_URL=${{vars.NEXT_PUBLIC_API_URL}}
              NEXT_PUBLIC_AUTH_API_URL=${{vars.NEXT_PUBLIC_AUTH_API_URL}}
              NEXT_PUBLIC_LISTING_API_URL=${{vars.NEXT_PUBLIC_LISTING_API_URL}}
              NEXT_PUBLIC_PAYMENT_API_URL=${{vars.NEXT_PUBLIC_PAYMENT_API_URL}}
              NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      # The gha/registry cache backends need a container-driver buildx builder;
      # the default docker driver only supports inline cache export.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ZIKA__AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ZIKA__AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ${{ matrix.app_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:dev-latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:dev-${{ github.sha }}
          # gha backend caches ALL stages (incl. the builder's pnpm install) in
          # GitHub's cache service between runs, so unchanged lockfiles skip the
          # store download entirely. Inline (default, mode=min) only cached the
          # final-stage layers, which is why installs rebuilt every run.
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.image }}:dev-latest
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          build-args: ${{ matrix.build_args }}
  deploy:
    name: "Deploy to Development"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ZIKA__EC2_HOST }}
          username: ${{ secrets.ZIKA__USER }}
          key: ${{ secrets.ZIKA__SSH_KEY }}
          timeout: 60s
          proxy_timeout: 60s
          script: |
            set -euo pipefail
            cd /home/ubuntu/Zika-Booking
            git fetch origin dev
            git switch dev
            git reset --hard origin/dev
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker compose pull
            docker compose run --rm auth-service pnpm exec prisma migrate deploy
            docker compose run --rm listing-service pnpm exec prisma migrate deploy
            docker compose run --rm payment-service pnpm exec prisma migrate deploy
            docker compose up -d --remove-orphans
            docker system prune -af
