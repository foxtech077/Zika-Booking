services:
  postgres:
    image: postgres:16-alpine
    container_name: zika-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: zika_booking
    ports:
      - "5438:5432"
    volumes:
      - zika-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zika-redis
    ports:
      - "6379:6379"
    volumes:
      - zika-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zika-postgres-data:
  zika-redis-data:
